databases:
  - name: hub-db
    plan: free          # expires after 30 days; switch to basic-256mb to keep it
    region: virginia

services:
  - type: web
    name: hub
    runtime: python
    plan: free          # sleeps after 15 idle minutes; wakes in about a minute
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: hub-db
          property: connectionString
      - key: APP_TOKEN
        generateValue: true   # your login token; copy it from the service's Environment tab
