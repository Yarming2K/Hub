<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Blueprint: chalk-white linework on Prussian-blue drafting paper.
   Classes are "parts" in a parts list; assignments reference them with balloons. */
:root {
  --paper: #123e73;
  --paper-deep: #0c2f5c;
  --paper-lift: #184a85;
  --grid-minor: rgb(255 255 255 / .05);
  --grid-major: rgb(255 255 255 / .115);
  --ink: #eef4fb;
  --ink-dim: #a8c0dd;
  --line: rgb(238 244 251 / .55);
  --line-faint: rgb(238 244 251 / .22);
  --red: #ff8f7d;
  --yellow: #ffd65c;
  --yellow-ink: #10284b;
  --focus: #ffd65c;
  --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--paper);
  background-image:
    radial-gradient(ellipse at 50% 40%, transparent 55%, rgb(5 20 45 / .45)),
    linear-gradient(var(--grid-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid-minor) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
  background-size: 100% 100%, 100px 100px, 100px 100px, 20px 20px, 20px 20px;
  color: var(--ink);
  font: 400 16px/1.45 var(--body);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
select option { background: var(--paper-deep); color: var(--ink); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.letter { font-family: var(--cond); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }

/* ---------- drawing sheet ---------- */
.sheet {
  position: relative; margin: 18px; min-height: calc(100vh - 36px);
  border: 2px solid var(--line);
  display: grid; grid-template-columns: 272px 1fr;
}
.sheet::before {
  content: ""; position: absolute; inset: 5px; border: 1px solid var(--line-faint); pointer-events: none;
}
.zones-top, .zones-left { position: absolute; display: flex; font: 600 11px/1 var(--cond); color: var(--ink-dim); pointer-events: none; }
.zones-top { top: -15px; left: 0; right: 0; justify-content: space-around; }
.zones-left { left: -14px; top: 0; bottom: 0; flex-direction: column; justify-content: space-around; }
.draw-in { animation: draw 700ms cubic-bezier(.3,.7,.2,1) both; }
@keyframes draw { from { clip-path: inset(0 100% 100% 0); } to { clip-path: inset(0 0 0 0); } }

/* ---------- parts list (sidebar) ---------- */
aside.bom { border-right: 2px solid var(--line); background: rgb(12 47 92 / .55); min-width: 0; }
.bom-inner { padding: 22px 16px; position: sticky; top: 0; max-height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: baseline; gap: 10px; padding: 0 4px 18px; }
.brand b { font: 700 34px/1 var(--cond); letter-spacing: .04em; }
.brand span { font: 500 13px/1.2 var(--cond); color: var(--ink-dim); letter-spacing: .08em; text-transform: uppercase; }

.bom-h { font: 600 13px/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); margin: 0 0 8px 4px; display: flex; justify-content: space-between; align-items: center; }
.sheets, .parts { list-style: none; margin: 0 0 22px; padding: 0; border-top: 1px solid var(--line); }
.sheets li, .parts li { border-bottom: 1px solid var(--line-faint); }
.navbtn {
  width: 100%; display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 8px;
  background: none; border: 0; padding: 8px 6px; text-align: left; font-size: 15.5px;
}
.navbtn:hover { background: rgb(255 255 255 / .06); }
.navbtn[aria-current="true"] { background: var(--ink); color: var(--paper-deep); }
.navbtn .no { font: 600 13px/1 var(--cond); color: var(--ink-dim); text-align: center; }
.navbtn[aria-current="true"] .no, .navbtn[aria-current="true"] .qty { color: var(--paper-deep); }
.navbtn .qty { font: 600 15px/1 var(--cond); color: var(--ink-dim); font-variant-numeric: tabular-nums; min-width: 1.5em; text-align: right; }
.navbtn .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.parts-cols { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; padding: 0 6px 6px; font: 600 11px/1 var(--cond); letter-spacing: .1em; color: var(--ink-dim); }
.paused { opacity: .55; }
.text-btn { background: none; border: 0; padding: 2px 4px; font: 600 13px/1 var(--cond); letter-spacing: .08em; text-transform: uppercase; color: var(--yellow); }
.text-btn:hover { text-decoration: underline; }
.mobile-only { display: none; }

.sync-box { border: 1px solid var(--line); padding: 10px 12px 12px; position: relative; }
.sync-box .status { font-size: 14px; color: var(--ink-dim); display: block; margin-bottom: 8px; }
.sync-box .row { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- buttons ---------- */
.btn {
  border: 1.5px solid var(--line); background: transparent; padding: 6px 12px;
  font: 600 13.5px/1.1 var(--cond); letter-spacing: .08em; text-transform: uppercase;
}
.btn:hover { border-color: var(--ink); background: rgb(255 255 255 / .06); }
.btn[disabled] { opacity: .5; cursor: progress; }
.btn.solid { background: var(--ink); color: var(--paper-deep); border-color: var(--ink); }
.btn.solid:hover { background: #fff; }
.btn.hot { background: var(--yellow); color: var(--yellow-ink); border-color: var(--yellow); }

/* ---------- drawing area ---------- */
main { padding: 30px clamp(18px, 4vw, 54px) 90px; min-width: 0; max-width: 980px; width: 100%; }
.head { display: grid; grid-template-columns: 1fr auto; gap: 22px; align-items: end; margin-bottom: 18px; }
.eyebrow { font-size: 15px; color: var(--ink-dim); margin: 0 0 2px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
h1.title {
  margin: 0; font: 700 clamp(46px, 7vw, 78px)/.92 var(--cond); text-transform: uppercase; letter-spacing: .02em;
  overflow-wrap: anywhere;
}

.titleblock { border: 1.5px solid var(--line); display: grid; grid-template-columns: repeat(2, auto); font-size: 13px; min-width: 230px; }
.titleblock div { padding: 5px 9px; border-bottom: 1px solid var(--line-faint); }
.titleblock div:nth-child(odd) { border-right: 1px solid var(--line-faint); }
.titleblock div:nth-last-child(-n+2) { border-bottom: 0; }
.titleblock dt { font: 600 10.5px/1 var(--cond); letter-spacing: .1em; color: var(--ink-dim); text-transform: uppercase; margin-bottom: 3px; }
.titleblock dd { margin: 0; font: 600 16px/1.1 var(--cond); letter-spacing: .03em; }
.titleblock .warn { color: var(--red); }

/* week as a dimension line: ticks per day, balloons show how much is due */
.timeline { position: relative; margin: 4px 0 30px; padding: 56px 0 0; }
.timeline .axis { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1.5px solid var(--line); }
.timeline .axis::before, .timeline .axis::after {
  content: ""; position: absolute; top: -6px; width: 0; height: 0; border: 5px solid transparent;
}
.timeline .axis::before { left: -2px; border-right: 9px solid var(--line); border-left: 0; }
.timeline .axis::after { right: -2px; border-left: 9px solid var(--line); border-right: 0; }
.tick { position: relative; padding-top: 8px; text-align: left; font: 600 12.5px/1.15 var(--cond); letter-spacing: .06em; color: var(--ink-dim); text-transform: uppercase; }
.tick::before { content: ""; position: absolute; left: 0; top: -7px; height: 12px; border-left: 1.5px solid var(--line); }
.tick.is-today { color: var(--ink); }
.tick b { display: block; font-size: 17px; color: var(--ink); letter-spacing: .02em; }
.tick .balloon { position: absolute; left: -13px; top: -40px; }
.timeline .overdue-tag { position: absolute; left: 0; top: 0; font: 600 13px/1 var(--cond); letter-spacing: .08em; color: var(--red); text-transform: uppercase; }
.timeline .caption { position: absolute; right: 0; top: 4px; font: 600 12px/1 var(--cond); letter-spacing: .1em; color: var(--ink-dim); text-transform: uppercase; }

.balloon {
  display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
  border: 1.5px solid var(--ink); font: 700 13px/1 var(--cond); background: var(--paper);
}
.balloon.sm { width: 21px; height: 21px; font-size: 11.5px; }
.balloon.hot { background: var(--yellow); color: var(--yellow-ink); border-color: var(--yellow); }

/* general notes = next steps for each part */
.notes-block { border: 1.5px solid var(--line); margin: 0 0 34px; }
.notes-block > header { display: flex; justify-content: space-between; align-items: center; padding: 7px 12px; border-bottom: 1px solid var(--line); background: rgb(255 255 255 / .04); }
.notes-block ul { list-style: none; margin: 0; padding: 0; }
.notes-block li + li { border-top: 1px dashed var(--line-faint); }
.notes-block button { width: 100%; display: grid; grid-template-columns: 26px 1fr; gap: 12px; align-items: start; background: none; border: 0; padding: 12px; text-align: left; }
.notes-block button:hover { background: rgb(255 255 255 / .05); }
.notes-block .part { font: 600 13px/1 var(--cond); letter-spacing: .08em; color: var(--ink-dim); text-transform: uppercase; display: block; margin-bottom: 4px; }
.notes-block .step { font-size: 20px; font-weight: 600; line-height: 1.25; }

/* project header */
.meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.meta select, .meta input[type=color] { border: 1px solid var(--line); background: transparent; padding: 3px 8px; font-size: 14px; }
.meta input[type=color] { width: 34px; height: 28px; padding: 2px; }
.name-input { font: 700 clamp(46px, 7vw, 78px)/.92 var(--cond); text-transform: uppercase; letter-spacing: .02em; border: 0; background: none; padding: 0; width: 100%; }
.name-input:hover { background: rgb(255 255 255 / .05); }
.next-wrap { border: 1.5px solid var(--yellow); padding: 10px 14px 12px; margin: 0 0 30px; position: relative; }
.next-wrap label { font: 600 12.5px/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--yellow); display: block; margin-bottom: 6px; }
.next { font-size: clamp(22px, 3vw, 30px); line-height: 1.2; font-weight: 600; border: 0; background: none; width: 100%; resize: none; padding: 0; overflow: hidden; display: block; }
.next::placeholder { color: var(--ink-dim); opacity: .7; }

/* quick add */
.add { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; border: 1.5px solid var(--line); padding: 6px; margin-bottom: 6px; background: rgb(12 47 92 / .5); }
.add:focus-within { border-color: var(--ink); }
.add input[type=text] { flex: 1 1 220px; border: 0; background: none; padding: 8px 8px; font-size: 17px; min-width: 0; }
.add input[type=text]::placeholder { color: var(--ink-dim); }
.add input[type=text]:focus-visible { outline: none; }
.chip { border: 1px solid var(--line-faint); background: none; padding: 4px 10px; font: 600 13px/1.1 var(--cond); letter-spacing: .08em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--yellow); border-color: var(--yellow); color: var(--yellow-ink); }
.chip input[type=date] { border: 0; background: none; font: 500 14px var(--body); padding: 0; width: 8.6em; text-transform: none; letter-spacing: 0; }
.hint { color: var(--ink-dim); font-size: 13.5px; margin: 0 0 26px 2px; }

/* task rows */
.section-h { font: 600 15px/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); margin: 34px 0 6px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.tasks { list-style: none; margin: 0; padding: 0; border-top: 1.5px solid var(--line); }
.task { display: grid; grid-template-columns: 28px 1fr auto; gap: 14px; align-items: start; padding: 13px 4px 13px 6px; border-bottom: 1px solid var(--line-faint); position: relative; }
.task.high::before { content: "!"; position: absolute; left: -24px; top: 14px; width: 0; height: 0; border: 9px solid transparent; border-bottom: 16px solid var(--yellow); border-top: 0; font: 700 11px/1 var(--cond); color: var(--yellow-ink); text-indent: -2px; padding-top: 4px; display: flex; justify-content: center; }
.task.selected { background: rgb(255 214 92 / .12); outline: 1px dashed var(--yellow); outline-offset: -1px; }
.check { width: 24px; height: 24px; margin-top: 2px; border: 1.5px solid var(--ink); background: none; padding: 0; display: grid; place-items: center; }
.check svg { opacity: 0; }
.check:hover { background: rgb(255 255 255 / .08); }
.task.done .check { background: var(--ink); }
.task.done .check svg { opacity: 1; color: var(--paper-deep); }
.task.done .title { color: var(--ink-dim); text-decoration: line-through; text-decoration-color: var(--red); }
.selbox { width: 24px; height: 24px; margin-top: 2px; border: 1.5px dashed var(--yellow); background: none; padding: 0; color: var(--yellow-ink); font: 700 15px/1 var(--cond); }
.selbox[aria-pressed="true"] { background: var(--yellow); border-style: solid; }
.title { border: 0; background: none; padding: 0; width: 100%; font-size: 17.5px; font-weight: 500; line-height: 1.35; }
.title:hover { background: rgb(255 255 255 / .05); }
.sub { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; font-size: 14px; color: var(--ink-dim); margin-top: 5px; }
.sub .tag { display: inline-flex; align-items: center; gap: 6px; }
.sub .src { font: 600 12.5px/1 var(--cond); letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line-faint); padding: 3px 5px; }
.sub a { color: var(--ink); }
.stamp { font: 700 12px/1 var(--cond); letter-spacing: .12em; text-transform: uppercase; color: var(--yellow); border: 1.5px solid var(--yellow); padding: 3px 6px; transform: rotate(-4deg); display: inline-block; }

/* due date drawn as a dimension: the further away, the longer the line */
.dim { display: inline-flex; align-items: center; gap: 6px; font: 600 13px/1 var(--cond); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.dim i { display: inline-block; height: 0; width: calc(var(--w) / 2); border-top: 1px solid var(--line); position: relative; }
.dim i:first-child::before, .dim i:last-child::after { content: ""; position: absolute; top: -5px; height: 9px; border-left: 1px solid var(--line); }
.dim i:first-child::before { left: 0; }
.dim i:last-child::after { right: 0; }
.dim.soon { color: var(--yellow); }
.dim.late { color: var(--red); text-decoration: underline wavy var(--red); text-underline-offset: 4px; }

.actions { display: flex; gap: 2px; align-items: center; justify-content: flex-end; }
.reveal { display: contents; }
.act { background: none; border: 0; padding: 5px 7px; font: 600 12.5px/1 var(--cond); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-dim); }
.act:hover { color: var(--ink); background: rgb(255 255 255 / .07); }
.act[aria-pressed="true"] { color: var(--yellow); }
.act.coach-btn { color: var(--yellow); }
.move { border: 0; background: none; padding: 5px 4px; font: 600 12.5px/1 var(--cond); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-dim); max-width: 9em; }
.move:hover { color: var(--ink); }
@media (hover: hover) and (min-width: 801px) {
  .task .actions .reveal > * { opacity: 0; }
  .task:hover .actions .reveal > *, .task:focus-within .actions .reveal > * { opacity: 1; }
}
.empty { color: var(--ink-dim); padding: 22px 6px; border-bottom: 1px solid var(--line-faint); }

/* one-tap filing in Inbox */
.file-to { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 9px; }
.file-to .lbl { font: 600 12px/1 var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); margin-right: 2px; }
.fileto-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; border: 1px solid var(--line-faint); background: none; padding: 3px 10px 3px 4px; font-size: 14px; max-width: 13em; }
.fileto-btn span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fileto-btn:hover, .fileto-btn:focus-visible { border-color: var(--yellow); color: var(--yellow); }
.fileto-btn:hover .balloon { border-color: var(--yellow); }

/* inbox tools */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 14px; }
.selbar { position: sticky; top: 8px; z-index: 5; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--yellow); color: var(--yellow-ink); padding: 8px 12px; margin: 0 0 12px; font: 600 15px/1.2 var(--cond); letter-spacing: .05em; text-transform: uppercase; }
.selbar select, .selbar button { border: 1.5px solid var(--yellow-ink); background: transparent; color: var(--yellow-ink); padding: 4px 8px; font: inherit; }
.selbar select option { background: #fff; color: #10284b; }
.selbar .grow { flex: 1; }
.rules { border: 1.5px dashed var(--line); padding: 12px 14px; margin: 0 0 22px; }
.rules p { margin: 0 0 10px; color: var(--ink-dim); font-size: 14.5px; }
.rule { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px dashed var(--line-faint); font-size: 15px; }
.rule q { font-weight: 600; }
.rule .arrow { color: var(--ink-dim); }
.rule-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.rule-form input, .rule-form select { border: 1px solid var(--line); background: transparent; padding: 6px 8px; font-size: 15px; min-width: 0; }
.rule-form input { flex: 1 1 140px; }

/* files */
.files-btn { background: none; border: 0; padding: 0; color: var(--ink); font-size: 14px; display: inline-flex; gap: 4px; align-items: center; }
.files-btn:hover { text-decoration: underline; }
.files { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.file { position: relative; width: 116px; border: 1.5px solid var(--line); background: var(--paper-deep); }
.file > button.open { display: block; width: 100%; border: 0; padding: 0; background: none; text-align: left; }
.file .thumb { width: 100%; height: 84px; object-fit: cover; display: block; filter: grayscale(.25) contrast(1.05); }
.file .pdf { height: 84px; display: grid; place-items: center; font: 700 22px var(--cond); letter-spacing: .1em; color: var(--yellow); border-bottom: 1px solid var(--line-faint); }
.file .fname { font-size: 12.5px; padding: 5px 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.file .remove { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--red); color: #2a0d07; font-size: 15px; line-height: 1; display: grid; place-items: center; padding: 0; }
@media (hover: hover) { .file .remove { opacity: 0; } .file:hover .remove, .file:focus-within .remove { opacity: 1; } }
.dropzone { width: 116px; min-height: 116px; border: 1.5px dashed var(--line); background: none; color: var(--ink-dim); font: 600 13px/1.25 var(--cond); letter-spacing: .08em; text-transform: uppercase; padding: 8px; display: grid; place-items: center; text-align: center; }
.dropzone:hover { border-color: var(--ink); color: var(--ink); }
.drag-over { outline: 2px dashed var(--yellow); outline-offset: 2px; background: rgb(255 214 92 / .08); }
.section-note { color: var(--ink-dim); font: 400 14px var(--body); letter-spacing: 0; text-transform: none; }
.notes { width: 100%; min-height: 100px; border: 1.5px solid var(--line); background: rgb(12 47 92 / .5); padding: 10px 12px; resize: vertical; line-height: 1.5; }
.danger { background: none; border: 0; color: var(--red); font: 600 13px/1 var(--cond); letter-spacing: .09em; text-transform: uppercase; padding: 4px 0; margin-top: 18px; }

/* ---------- coach (design review panel) ---------- */
.coach {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); z-index: 30;
  background: var(--paper-deep); border-left: 2px solid var(--ink);
  display: grid; grid-template-rows: auto 1fr auto; box-shadow: -18px 0 40px rgb(3 14 32 / .45);
  background-image: linear-gradient(var(--grid-minor) 1px, transparent 1px), linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
  background-size: 20px 20px;
  animation: slide 220ms ease-out both;
}
@keyframes slide { from { transform: translateX(30px); opacity: 0; } }
.coach[hidden] { display: none; }
.coach header { padding: 16px 18px 12px; border-bottom: 1.5px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.coach header .k { font: 600 12px/1 var(--cond); letter-spacing: .12em; text-transform: uppercase; color: var(--yellow); }
.coach header h2 { margin: 0; font: 700 24px/1.1 var(--cond); text-transform: uppercase; letter-spacing: .03em; grid-column: 1; }
.coach header .x { grid-row: 1 / span 2; grid-column: 2; align-self: start; }
.coach header .ctx { grid-column: 1 / -1; font-size: 13.5px; color: var(--ink-dim); }
.coach .log { overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 92%; font-size: 15.5px; line-height: 1.5; }
.msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
.msg ul, .msg ol { margin: 4px 0 8px; padding-left: 20px; } .msg li { margin: 3px 0; }
.msg.user { align-self: flex-end; background: var(--ink); color: var(--paper-deep); padding: 9px 12px; }
.msg.coach-msg { align-self: flex-start; border-left: 3px solid var(--yellow); padding: 2px 0 2px 12px; }
.msg.err { border-left-color: var(--red); color: var(--red); }
.msg.thinking { color: var(--ink-dim); font: 600 13px var(--cond); letter-spacing: .1em; text-transform: uppercase; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.coach form { border-top: 1.5px solid var(--line); padding: 12px 14px 14px; display: grid; gap: 8px; background: var(--paper-deep); }
.coach textarea { width: 100%; min-height: 64px; max-height: 40vh; resize: vertical; border: 1.5px solid var(--line); background: rgb(255 255 255 / .04); padding: 9px 10px; line-height: 1.4; }
.coach .row { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
.coach .fine { font-size: 12.5px; color: var(--ink-dim); }
.setup ol { padding-left: 20px; line-height: 1.6; margin: 8px 0; }
.setup code { background: rgb(255 255 255 / .1); padding: 1px 5px; }

/* ---------- dialogs, toast, gate ---------- */
dialog.panel { border: 2px solid var(--ink); background: var(--paper-deep); color: var(--ink); padding: 22px; width: min(520px, calc(100vw - 32px)); }
dialog.panel::backdrop { background: rgb(3 14 32 / .65); }
dialog.panel h2 { margin: 0 0 4px; font: 700 28px/1.1 var(--cond); text-transform: uppercase; letter-spacing: .03em; }
dialog.panel ol { padding-left: 20px; margin: 12px 0 16px; line-height: 1.6; }
dialog.panel input { width: 100%; border: 1.5px solid var(--line); background: transparent; padding: 10px 12px; margin-bottom: 6px; }
dialog.panel .err { color: var(--red); font-size: 14px; min-height: 1.4em; margin: 0 0 10px; }
dialog.panel .buttons { display: flex; gap: 8px; justify-content: flex-end; }
dialog.viewer { border: 0; padding: 0; background: none; max-width: 96vw; max-height: 96vh; }
dialog.viewer::backdrop { background: rgb(3 14 32 / .88); }
dialog.viewer img { display: block; max-width: 96vw; max-height: 86vh; border: 2px solid var(--ink); }
dialog.viewer .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--ink); padding: 10px 2px 0; font-size: 14px; }
dialog.viewer .bar a { color: var(--ink); }

.gate { max-width: 440px; margin: 16vh auto; padding: 26px; border: 2px solid var(--line); background: rgb(12 47 92 / .7); }
.gate h1 { font: 700 54px/1 var(--cond); text-transform: uppercase; margin: 0 0 8px; }
.gate p { color: var(--ink-dim); margin: 0 0 18px; }
.gate form { display: flex; gap: 8px; }
.gate input { flex: 1; border: 1.5px solid var(--line); background: transparent; padding: 10px 12px; min-width: 0; }

.toast {
  position: fixed; left: 50%; bottom: 22px; z-index: 40; transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--yellow); color: var(--yellow-ink); padding: 10px 16px; font: 600 15px/1.2 var(--cond); letter-spacing: .05em;
  box-shadow: 0 8px 24px rgb(3 14 32 / .4);
  transition: opacity .2s, transform .2s; pointer-events: none; display: flex; gap: 12px; align-items: center; max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.toast button { background: none; border: 0; color: var(--yellow-ink); font-weight: 700; text-decoration: underline; padding: 0; }

/* ---------- phone ---------- */
@media (max-width: 800px) {
  .sheet { margin: 8px; grid-template-columns: minmax(0, 1fr); min-height: calc(100vh - 16px); }
  .zones-top, .zones-left { display: none; }
  aside.bom { border-right: 0; border-bottom: 2px solid var(--line); }
  .bom-inner { position: static; max-height: none; padding: 14px 0 12px; }
  .brand { padding: 0 14px 10px; }
  .bom-h, .parts-cols { display: none; }
  .navwrap { display: flex; gap: 6px; overflow-x: auto; padding: 0 14px; scrollbar-width: none; }
  .sheets, .parts { display: contents; }
  .sheets li, .parts li { border: 0; flex: none; }
  .navbtn { border: 1px solid var(--line); grid-template-columns: auto auto auto; padding: 7px 10px; white-space: nowrap; }
  .navbtn .no:empty { display: none; }
  .mobile-only { display: block; }
  .sync-box { margin: 12px 14px 0; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 8px 10px; }
  .sync-box .status { margin: 0; }
  main { padding: 20px 14px 80px; }
  .head { grid-template-columns: 1fr; gap: 14px; }
  .titleblock { min-width: 0; }
  .task { grid-template-columns: 28px 1fr; padding-left: 4px; }
  .task .actions { grid-column: 2; margin: -2px 0 0 -7px; flex-wrap: wrap; min-width: 0; justify-content: flex-start; }
  .task > div { min-width: 0; }
  .task.high::before { left: -14px; transform: scale(.8); }
  .tick { font-size: 11px; } .tick b { font-size: 15px; }
  .timeline .caption { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .toast { transition: none; }
  .draw-in, .coach { animation: none; }
}
</style>
</head>
<body>
<div id="root"></div>
<aside class="coach" id="coach" hidden aria-label="Study coach"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-picker" accept="image/*,application/pdf" multiple hidden>
<dialog class="panel" id="sg-dialog" aria-labelledby="sg-title">
  <form id="sg-form" method="dialog">
    <h2 id="sg-title">Connect Schoology</h2>
    <ol>
      <li>In Schoology, open <strong>Settings</strong>.</li>
      <li>Find the calendar link (iCal) and copy it.</li>
      <li>Paste it here.</li>
    </ol>
    <label class="sr" for="sg-url">Schoology calendar link</label>
    <input id="sg-url" type="password" placeholder="webcal://lms.fcps.edu/calendar/feed/ical/…" autocomplete="off" required>
    <p class="err" id="sg-err" role="alert"></p>
    <div class="buttons"><button type="button" class="btn" id="sg-cancel">Cancel</button><button class="btn solid" type="submit">Connect and sync</button></div>
  </form>
</dialog>
<dialog class="viewer" id="viewer" aria-label="Attachment preview">
  <img id="viewer-img" alt="">
  <div class="bar"><span id="viewer-name"></span><span><a id="viewer-dl" download>Download</a> <button type="button" class="btn" id="viewer-close">Close</button></span></div>
</dialog>

<script>
const TOKEN_KEY = "hub.token";
const state = {
  projects: [], tasks: [], attachments: [], rules: [],
  schoology: { connected: false, last_sync: null }, coachInfo: { enabled: false },
  syncing: false, open: new Set(), view: "today", draft: { high: false, today: false, due: "" },
  selecting: false, selected: new Set(), showRules: false,
  coach: { taskId: null, messages: [], busy: false, error: "" },
};
const $root = document.getElementById("root");
let firstPaint = true;

// ---------- storage ----------
function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; } }
function setToken(t) { try { localStorage.setItem(TOKEN_KEY, t); } catch {} }

// ---------- api ----------
class AuthError extends Error {}
async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json" };
  const tok = getToken();
  if (tok) headers.Authorization = "Bearer " + tok;
  const res = await fetch(path, { ...opts, headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (res.status === 401) throw new AuthError();
  if (!res.ok) {
    let msg = res.statusText;
    try { const j = await res.json(); msg = typeof j.detail === "string" ? j.detail : "Check the fields and try again"; } catch {}
    throw new Error(msg);
  }
  return res.status === 204 ? null : res.json();
}
// Optional extras shouldn't break the page if the server is older
const soft = (p, fallback) => p.catch(e => { if (e instanceof AuthError) throw e; return fallback; });

async function load() {
  try {
    const [projects, tasks, attachments, sg, rules, coachInfo] = await Promise.all([
      api("/api/projects"), api("/api/tasks?done_days=7"), api("/api/attachments"), api("/api/schoology"),
      soft(api("/api/rules"), []), soft(api("/api/coach"), { enabled: false })]);
    Object.assign(state, { projects, tasks, attachments, schoology: sg, rules, coachInfo });
    for (const id of [...state.selected]) if (!tasks.some(t => t.id === id && !t.done)) state.selected.delete(id);
    render();
    maybeAutoSync();
  } catch (e) {
    if (e instanceof AuthError) return renderGate();
    $root.innerHTML = `<div class="gate"><h1>Offline</h1><p>${esc(e.message)}. Check your connection, then reload.</p></div>`;
  }
}

async function run(fn, okMsg) {
  try { await fn(); await load(); if (okMsg) toast(okMsg); }
  catch (e) { if (e instanceof AuthError) renderGate(); else toast(e.message); }
}

// ---------- helpers ----------
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function localDate(d = new Date()) {
  const z = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
}
function addDays(iso, n) { const d = new Date(iso + "T12:00"); d.setDate(d.getDate() + n); return localDate(d); }
function daysBetween(a, b) { return Math.round((new Date(b + "T12:00") - new Date(a + "T12:00")) / 86400000); }
function project(id) { return state.projects.find(p => p.id === id); }
function partNo(id) { const i = state.projects.findIndex(p => p.id === id); return i < 0 ? "" : i + 1; }
function isToday(t) { const today = localDate(); return t.today || (t.due && t.due <= today); }
function upcoming() {
  const today = localDate();
  return state.tasks
    .filter(t => !t.done && !isToday(t) && t.due && daysBetween(today, t.due) <= 7)
    .sort((a, b) => a.due.localeCompare(b.due));
}
function doneToday(t) { return t.done && t.completed_at && localDate(new Date(t.completed_at)) === localDate(); }
function plural(n, word) { return `${n} ${word}${n === 1 ? "" : "s"}`; }

// Due date as a dimension line: longer line = more time left (capped at two weeks)
function dueDim(due) {
  if (!due) return "";
  const diff = daysBetween(localDate(), due);
  if (diff < 0) return `<span class="dim late">Overdue ${plural(-diff, "day")}</span>`;
  if (diff === 0) return `<span class="dim soon">Due today</span>`;
  const w = Math.round(28 + Math.min(diff, 14) / 14 * 120);
  const label = diff === 1 ? "Tomorrow" : diff < 7 ? new Date(due + "T12:00").toLocaleDateString(undefined, { weekday: "short" }) + " · " + plural(diff, "day")
    : new Date(due + "T12:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
  return `<span class="dim ${diff <= 1 ? "soon" : ""}" style="--w:${w}px" title="Due ${esc(due)}"><i></i>${esc(label)}<i></i></span>`;
}

let toastTimer;
function toast(msg, undo) {
  const el = document.getElementById("toast");
  el.innerHTML = esc(msg) + (undo ? ` <button type="button">Undo</button>` : "");
  if (undo) el.querySelector("button").onclick = () => { el.classList.remove("show"); undo(); };
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), undo ? 5000 : 2600);
}

function autosize(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }

// ---------- views ----------
function currentProject() { return typeof state.view === "number" ? project(state.view) : null; }

function scopeTasks() {
  const v = state.view;
  if (v === "today") return state.tasks;
  if (v === "inbox") return state.tasks.filter(t => t.project_id == null);
  return state.tasks.filter(t => t.project_id === v);
}

function visibleTasks() {
  const v = state.view;
  if (v === "today") return { open: state.tasks.filter(t => !t.done && isToday(t)), done: state.tasks.filter(doneToday) };
  const scoped = scopeTasks();
  return { open: scoped.filter(t => !t.done), done: scoped.filter(t => t.done) };
}

function navBtn(view, label, qty, no, extra = "") {
  return `<li><button type="button" class="navbtn ${extra}" data-view="${view}" aria-current="${state.view === view}">
    <span class="no">${no}</span><span class="name">${esc(label)}</span><span class="qty">${qty || ""}</span></button></li>`;
}

function renderNav() {
  const todayCount = state.tasks.filter(t => !t.done && isToday(t)).length;
  const inboxCount = state.tasks.filter(t => !t.done && t.project_id == null).length;
  return `<aside class="bom"><div class="bom-inner">
    <div class="brand"><b>Hub</b><span>Drawing set</span></div>
    <div class="bom-h">Sheets</div>
    <div class="navwrap">
      <ul class="sheets">
        ${navBtn("today", "Today", todayCount, "")}
        ${navBtn("inbox", "Inbox", inboxCount, "")}
      </ul>
      <div class="bom-h" style="margin-top:4px">Parts list <button type="button" class="text-btn" data-act="new-project">Add part</button></div>
      <div class="parts-cols"><span>No.</span><span>Class or project</span><span>Open</span></div>
      <ul class="parts">
        ${state.projects.map((p, i) => navBtn(p.id, p.name, p.status === "done" ? "" : p.open_tasks, i + 1, p.status !== "active" ? "paused" : "")).join("")}
        <li class="mobile-only"><button type="button" class="navbtn" data-act="new-project"><span class="no"></span><span class="name">+ Add part</span><span class="qty"></span></button></li>
      </ul>
    </div>
    ${syncBox()}
  </div></aside>`;
}

function ago(iso) {
  if (!iso) return "never";
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${plural(hrs, "hour")} ago`;
  const days = Math.round(hrs / 24);
  return days === 1 ? "yesterday" : `${days} days ago`;
}

function syncBox() {
  const sg = state.schoology;
  if (!sg.connected) {
    return `<div class="sync-box"><span class="status">Bring in your assignments</span>
      <div class="row"><button type="button" class="btn" data-act="sg-connect">Connect Schoology</button></div></div>`;
  }
  return `<div class="sync-box"><span class="status">Schoology synced ${esc(ago(sg.last_sync))}</span>
    <div class="row">
      <button type="button" class="btn" data-act="sg-sync" ${state.syncing ? "disabled" : ""}>${state.syncing ? "Syncing…" : "Sync now"}</button>
      <button type="button" class="btn" data-act="sg-disconnect">Disconnect</button>
    </div></div>`;
}

const CLIP = `<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 4.5l-5 5a1.4 1.4 0 0 0 2 2l5.5-5.5a2.8 2.8 0 0 0-4-4L3.5 7.5a4.2 4.2 0 0 0 6 6l4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;
const CHECK = `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/></svg>`;

function fileTile(a) {
  const isPdf = a.content_type === "application/pdf";
  return `<div class="file" data-att="${a.id}">
    <button type="button" class="open" data-act="att-open" aria-label="Open ${esc(a.filename)}">
      ${isPdf ? `<span class="pdf" aria-hidden="true">PDF</span>` : `<img class="thumb" data-thumb="${a.id}" alt="">`}
      <span class="fname">${esc(a.filename)}</span>
    </button>
    <button type="button" class="remove" data-act="att-delete" aria-label="Remove ${esc(a.filename)}">×</button>
  </div>`;
}

// Inbox: tap a class to file the assignment there
function fileToRow(t) {
  const classes = state.projects.filter(p => p.status === "active");
  if (!classes.length) return "";
  return `<div class="file-to" role="group" aria-label="File ${esc(t.title)} under">
    <span class="lbl">File to</span>
    ${classes.map(p => `<button type="button" class="fileto-btn" data-act="file-to" data-pid="${p.id}" title="File under ${esc(p.name)}">
      <span class="balloon sm">${partNo(p.id)}</span><span>${esc(p.name)}</span></button>`).join("")}
  </div>`;
}

function taskRow(t) {
  const p = project(t.project_id);
  const showPart = (state.view === "today" || state.view === "inbox") && p;
  const files = state.attachments.filter(a => a.task_id === t.id);
  const expanded = state.open.has(t.id);
  const selecting = state.selecting && state.view === "inbox" && !t.done;
  const sel = state.selected.has(t.id);
  const lead = selecting
    ? `<button type="button" class="selbox" data-act="select" aria-pressed="${sel}" aria-label="Select ${esc(t.title)}">${sel ? "✓" : ""}</button>`
    : `<button type="button" class="check" data-act="toggle" aria-label="${t.done ? "Mark not done" : "Mark done"}: ${esc(t.title)}">${CHECK}</button>`;
  return `<li class="task ${t.done ? "done" : ""} ${t.priority === 2 ? "high" : ""} ${sel ? "selected" : ""}" data-id="${t.id}" data-drop="task">
    ${lead}
    <div>
      <input class="title" data-act="rename" value="${esc(t.title)}" aria-label="Task title" ${selecting ? "readonly" : ""}>
      <div class="sub">
        ${showPart ? `<span class="tag"><span class="balloon sm">${partNo(p.id)}</span>${esc(p.name)}</span>` : ""}
        ${t.done ? (doneToday(t) ? `<span class="stamp">Done</span>` : "") : dueDim(t.due)}
        ${t.source === "schoology" ? `<span class="src">Schoology</span>` : ""}
        ${t.link && t.link.startsWith("https://") ? `<a href="${esc(t.link)}" target="_blank" rel="noopener noreferrer">Open in Schoology</a>` : ""}
        ${files.length ? `<button type="button" class="files-btn" data-act="toggle-files" aria-expanded="${expanded}">${CLIP}${plural(files.length, "file")}</button>` : ""}
      </div>
      ${expanded && files.length ? `<div class="files">${files.map(fileTile).join("")}</div>` : ""}
      ${state.view === "inbox" && !t.done && !selecting ? fileToRow(t) : ""}
    </div>
    ${selecting ? "" : `<div class="actions">
      <span class="reveal">
      ${t.done ? "" : `<button type="button" class="act" data-act="pin" aria-pressed="${t.today}" title="${t.today ? "Remove from Today" : "Add to Today"}">${t.today ? "On today" : "Today"}</button>
      <button type="button" class="act" data-act="prio" aria-pressed="${t.priority === 2}">High</button>`}
      <button type="button" class="act" data-act="attach" aria-label="Attach a photo or PDF to ${esc(t.title)}">Attach</button>
      ${t.done ? "" : `<label class="sr" for="move-${t.id}">Move ${esc(t.title)} to</label>
      <select class="move" id="move-${t.id}" data-act="move">
        <option value="" ${t.project_id == null ? "selected" : ""}>${t.project_id == null ? "Move" : "Inbox"}</option>
        ${state.projects.filter(x => x.status !== "done").map(x => `<option value="${x.id}" ${x.id === t.project_id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}
      </select>`}
      <button type="button" class="act" data-act="delete" aria-label="Delete ${esc(t.title)}">Delete</button>
      </span>
      ${t.done ? "" : `<button type="button" class="act coach-btn" data-act="coach">Coach</button>`}
    </div>`}
  </li>`;
}

function titleBlock(drawing) {
  const scoped = scopeTasks().filter(t => !t.done);
  const today = localDate();
  const soon = scoped.filter(t => t.due && daysBetween(today, t.due) <= 2 && t.due >= today).length;
  const late = scoped.filter(t => t.due && t.due < today).length;
  const d = new Date().toLocaleDateString(undefined, { month: "2-digit", day: "2-digit", year: "2-digit" });
  return `<dl class="titleblock">
    <div><dt>Drawing</dt><dd>${esc(drawing)}</dd></div>
    <div><dt>Date</dt><dd>${esc(d)}</dd></div>
    <div><dt>Open</dt><dd>${scoped.length}</dd></div>
    <div><dt>Due in 2 days</dt><dd>${soon}</dd></div>
    <div><dt>Overdue</dt><dd class="${late ? "warn" : ""}">${late}</dd></div>
    <div><dt>Schoology</dt><dd>${state.schoology.connected ? esc(ago(state.schoology.last_sync)) : "Off"}</dd></div>
  </dl>`;
}

// The coming week drawn as a dimension line; a balloon over each day shows how much is due
function timeline() {
  const today = localDate();
  const scoped = scopeTasks().filter(t => !t.done && t.due);
  const late = scoped.filter(t => t.due < today).length;
  const days = [...Array(7)].map((_, i) => addDays(today, i));
  return `<div class="timeline" aria-label="Due dates this week">
    ${late ? `<span class="overdue-tag">◂ ${plural(late, "overdue")}</span>` : ""}
    <span class="caption">Next 7 days</span>
    <div class="axis">${days.map((d, i) => {
      const n = scoped.filter(t => t.due === d).length;
      const dt = new Date(d + "T12:00");
      return `<div class="tick ${i === 0 ? "is-today" : ""}">
        ${n ? `<span class="balloon ${i <= 1 ? "hot" : ""}" title="${plural(n, "item")} due">${n}</span>` : ""}
        ${i === 0 ? "Today" : dt.toLocaleDateString(undefined, { weekday: "short" })}<b>${dt.getDate()}</b></div>`;
    }).join("")}</div>
  </div>`;
}

function renderHeader() {
  const p = currentProject();
  if (state.view === "today") {
    const withSteps = state.projects.filter(x => x.status === "active" && x.next_step.trim());
    const d = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    return `<div class="head"><div><p class="eyebrow">${esc(d)}</p><h1 class="title">Today</h1></div>${titleBlock("Today")}</div>
      ${timeline()}
      ${withSteps.length ? `<section class="notes-block"><header><span class="letter">Next steps</span><span class="section-note">One per part</span></header>
      <ul>${withSteps.map(x => `<li><button type="button" data-view="${x.id}">
        <span class="balloon">${partNo(x.id)}</span>
        <span><span class="part">${esc(x.name)}</span><span class="step">${esc(x.next_step)}</span></span>
      </button></li>`).join("")}</ul></section>` : ""}`;
  }
  if (state.view === "inbox") {
    return `<div class="head"><div><p class="eyebrow">Not filed under a class yet</p><h1 class="title">Inbox</h1></div>${titleBlock("Inbox")}</div>
      ${timeline()}`;
  }
  return `<div class="head"><div>
      <div class="eyebrow meta">
        <span class="balloon">${partNo(p.id)}</span>
        <span class="letter">Part ${partNo(p.id)}</span>
        <select data-act="proj-status" aria-label="Status">
          ${["active", "paused", "done"].map(s => `<option value="${s}" ${p.status === s ? "selected" : ""}>${{ active: "Active", paused: "Paused", done: "Finished" }[s]}</option>`).join("")}
        </select>
        <input type="color" data-act="proj-color" value="${esc(p.color)}" aria-label="Color">
      </div>
      <input class="name-input" data-act="proj-name" value="${esc(p.name)}" aria-label="Name">

// Tiny, safe markdown: escape first, then bold, lists and paragraphs
function md(text) {
  const lines = esc(text).split("\n");
  let html = "", list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of lines) {
    const line = raw.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    const ul = /^\s*[-*•]\s+(.*)$/.exec(line), ol = /^\s*\d+[.)]\s+(.*)$/.exec(line);
    if (ul || ol) {
      const kind = ul ? "ul" : "ol";
      if (list !== kind) { close(); html += `<${kind}>`; list = kind; }
      html += `<li>${(ul || ol)[1]}</li>`;
    } else if (!line.trim()) close();
    else { close(); html += `<p>${line.replace(/^#+\s*/, "")}</p>`; }
  }
  close();
  return html;
}

async function sendCoach(text) {
  const c = state.coach;
  text = text.trim();
  if (!text || c.busy) return;
  const input = document.getElementById("coach-input");
  if (input) input.value = "";
  c.messages.push({ role: "user", content: text });
  c.busy = true; c.error = "";
  renderCoach();
  try {
    const reply = await api(`/api/tasks/${c.taskId}/coach`, { method: "POST", body: { message: text } });
    if (state.coach !== c) return; // panel was closed or switched
    c.messages.push(reply);
  } catch (e) {
    if (e instanceof AuthError) return renderGate();
    c.messages.pop();
    c.error = e.message;
    if (input) document.getElementById("coach-input").value = text;
  }
  c.busy = false;
  renderCoach();
  document.getElementById("coach-input")?.focus();
}

// Files need the auth header, so they're fetched as blobs instead of plain <img src>
const blobCache = new Map();
async function blobUrl(id) {
  if (!blobCache.has(id)) {
    blobCache.set(id, (async () => {
      const tok = getToken();
      const res = await fetch(`/api/attachments/${id}/file`, { headers: tok ? { Authorization: "Bearer " + tok } : {} });
      if (!res.ok) { blobCache.delete(id); throw new Error("Couldn't load that file"); }
      return URL.createObjectURL(await res.blob());
    })());
  }
  return blobCache.get(id);
}

function loadThumbs() {
  document.querySelectorAll("img[data-thumb]:not([src])").forEach(img => {
    blobUrl(Number(img.dataset.thumb)).then(u => { img.src = u; }).catch(() => {});
  });
}

// Big phone photos are shrunk before upload so they load fast and fit the free database
async function shrink(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 1_500_000) return file;
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(bmp.width * scale); canvas.height = Math.round(bmp.height * scale);
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.85));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" });
  } catch { return file; }
}

async function uploadFiles(fileList, target) {
  const files = [...fileList];
  if (!files.length) return;
  toast(files.length === 1 ? "Uploading…" : `Uploading ${files.length} files…`);
  let ok = 0;
  for (const f of files) {
    try {
      const body = new FormData();
      body.append("file", await shrink(f));
      body.append(target.kind === "task" ? "task_id" : "project_id", target.id);
      const tok = getToken();
      const res = await fetch("/api/attachments", { method: "POST", body, headers: tok ? { Authorization: "Bearer " + tok } : {} });
      if (res.status === 401) return renderGate();
      if (!res.ok) { let m = "Upload failed"; try { m = (await res.json()).detail || m; } catch {} toast(`${f.name}: ${m}`); continue; }
      ok++;
    } catch { toast(`${f.name}: upload failed. Check your connection.`); }
  }
  if (target.kind === "task") state.open.add(target.id);
  await load();
  if (state.coach.taskId) renderCoach();
  if (ok) toast(ok === 1 ? "Attached" : `Attached ${ok} files`);
}

// Filing is instant on screen; the server catches up, and a failure puts it back
async function fileTo(t, pid, undoing = false) {
  const before = t.project_id;
  const bump = (id, n) => { const p = project(id); if (p) p.open_tasks += n; };
  t.project_id = pid; bump(pid, 1); bump(before, -1);
  render();
  try {
    await api(`/api/tasks/${t.id}`, { method: "PATCH", body: { project_id: pid } });
    if (!undoing) toast(`Filed to ${project(pid)?.name || "Inbox"}`, () => fileTo(t, before, true));
  } catch (e) {
    t.project_id = before; bump(pid, -1); bump(before, 1);
    render();
    if (e instanceof AuthError) return renderGate();
    toast(e.message);
  }
}

// ---------- quick-add parsing ----------
function parseTask(text) {
  let title = text, project_id, high = false;
  const tag = title.match(/(^|\s)#([\w-]+)/);
  if (tag) {
    const key = tag[2].toLowerCase().replace(/[-_]/g, "");
    const match = state.projects.find(p => p.name.toLowerCase().replace(/[\s\-_]/g, "").startsWith(key));
    if (match) { project_id = match.id; title = title.replace(tag[0], " "); }
  }
  if (/(^|\s)!(\s|$)/.test(title)) { high = true; title = title.replace(/(^|\s)!(?=\s|$)/g, " "); }
  return { title: title.replace(/\s+/g, " ").trim(), project_id, high };
}

// ---------- events ----------
document.addEventListener("click", e => {
  const viewBtn = e.target.closest("[data-view]");
  if (viewBtn) {
    const v = viewBtn.dataset.view;
    state.view = /^\d+$/.test(v) ? Number(v) : v;
    state.draft = { high: false, today: false, due: "" };
    state.selecting = false; state.selected.clear();
    render(); window.scrollTo(0, 0);
    return;
  }
  const el = e.target.closest("[data-act]");
  const row = (el || e.target).closest?.(".task");
  // In select mode, tapping anywhere on a row selects it
  if (state.selecting && row && !row.classList.contains("done") && (!el || el.dataset.act === "select" || el.dataset.act === "rename")) {
    const id = Number(row.dataset.id);
    state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id);
    render();
    return;
  }
  if (!el) return;
  const act = el.dataset.act;
  const id = row && Number(row.dataset.id);
  const t = id && state.tasks.find(x => x.id === id);

  if (act === "toggle") {
    run(() => api(`/api/tasks/${id}`, { method: "PATCH", body: { done: !t.done } }));
  } else if (act === "pin") {
    run(() => api(`/api/tasks/${id}`, { method: "PATCH", body: { today: !t.today } }));
  } else if (act === "prio") {
    run(() => api(`/api/tasks/${id}`, { method: "PATCH", body: { priority: t.priority === 2 ? 1 : 2 } }));
  } else if (act === "delete") {
    const nFiles = state.attachments.filter(a => a.task_id === id).length;
    if (nFiles && !confirm(`Delete "${t.title}" and its ${plural(nFiles, "attached file")}?`)) return;
    const copy = { title: t.title, project_id: t.project_id, priority: t.priority, due: t.due, today: t.today };
    if (state.coach.taskId === id) closeCoach();
    run(async () => { await api(`/api/tasks/${id}`, { method: "DELETE" }); })
      .then(() => toast("Task deleted", () => run(() => api("/api/tasks", { method: "POST", body: copy }), "Task restored")));
  } else if (act === "file-to") {
    fileTo(t, Number(el.dataset.pid));
  } else if (act === "coach") {
    openCoach(id);
  } else if (act === "coach-close") {
    closeCoach();
  } else if (act === "coach-quick") {
    sendCoach(QUICK[Number(el.dataset.i)][1]);
  } else if (act === "coach-clear") {
    if (confirm("Clear this conversation?")) {
      const c = state.coach;
      api(`/api/tasks/${c.taskId}/coach`, { method: "DELETE" }).then(() => { c.messages = []; c.error = ""; renderCoach(); }).catch(err => toast(err.message));
    }
  } else if (act === "sg-connect") {
    openConnect();
  } else if (act === "sg-sync") {
    syncSchoology(false);
  } else if (act === "sg-disconnect") {
    if (confirm("Disconnect Schoology? Assignments already imported will stay."))
      run(() => api("/api/schoology", { method: "DELETE" }), "Schoology disconnected");
  } else if (act === "sel-start") {
    state.selecting = true; state.selected.clear(); state.showRules = false; render();
  } else if (act === "sel-done") {
    state.selecting = false; state.selected.clear(); render();
  } else if (act === "sel-all") {
    const open = visibleTasks().open;
    if (state.selected.size === open.length) state.selected.clear(); else open.forEach(x => state.selected.add(x.id));
    render();
  } else if (act === "rules-toggle") {
    state.showRules = !state.showRules; render();
  } else if (act === "rule-del") {
    run(() => api(`/api/rules/${el.dataset.rule}`, { method: "DELETE" }), "Rule removed");
  } else if (act === "rules-apply") {
    run(async () => {
      const r = await api("/api/rules/apply", { method: "POST" });
      setTimeout(() => toast(r.moved ? `Filed ${plural(r.moved, "assignment")}` : "Nothing matched your rules"), 0);
    });
  } else if (act === "attach") {
    pickFiles({ kind: "task", id });
  } else if (act === "attach-project") {
    pickFiles({ kind: "project", id: currentProject().id });
  } else if (act === "toggle-files") {
    state.open.has(id) ? state.open.delete(id) : state.open.add(id);
    render();
  } else if (act === "att-open") {
    openAttachment(Number(el.closest("[data-att]").dataset.att));
  } else if (act === "att-delete") {
    const attId = Number(el.closest("[data-att]").dataset.att);
    const a = state.attachments.find(x => x.id === attId);
    if (confirm(`Remove "${a.filename}"?`)) run(() => api(`/api/attachments/${attId}`, { method: "DELETE" }), "File removed");
  } else if (act === "d-high") {
    state.draft.high = !state.draft.high; el.setAttribute("aria-pressed", state.draft.high);
  } else if (act === "d-today") {
    state.draft.today = !state.draft.today; el.setAttribute("aria-pressed", state.draft.today);
  } else if (act === "new-project") {
    const name = prompt("Name of the class or project");
    if (name && name.trim()) run(async () => {
      const palette = ["#5b8def", "#e0663c", "#3fa36b", "#9b6bd6", "#d4a017", "#2bb3b1", "#d6578f"];
      const p = await api("/api/projects", { method: "POST", body: { name: name.trim(), color: palette[state.projects.length % palette.length] } });
      state.view = p.id;
    }, "Part added");
  } else if (act === "proj-delete") {
    const p = currentProject();
    if (confirm(`Delete "${p.name}" and its ${plural(p.open_tasks, "open task")}? This can't be undone.`))
      run(async () => { await api(`/api/projects/${p.id}`, { method: "DELETE" }); state.view = "today"; }, "Deleted");
  }
});

document.addEventListener("submit", e => {
  const act = e.target.dataset.act;
  if (act === "rule-add") {
    e.preventDefault();
    const keyword = document.getElementById("rule-kw").value.trim();
    const project_id = Number(document.getElementById("rule-proj").value);
    if (keyword) run(() => api("/api/rules", { method: "POST", body: { keyword, project_id } }), "Rule added");
    return;
  }
  if (act !== "add") return;
  e.preventDefault();
  const input = document.getElementById("new-task");
  const parsed = parseTask(input.value);
  if (!parsed.title) return;
  const d = state.draft;
  const body = {
    title: parsed.title,
    project_id: parsed.project_id ?? currentProject()?.id ?? null,
    priority: parsed.high || d.high ? 2 : 1,
    due: d.due || null,
    today: state.view === "today" || d.today,
  };
  state.draft = { high: false, today: false, due: "" };
  run(() => api("/api/tasks", { method: "POST", body })).then(() => document.getElementById("new-task")?.focus());
});

document.addEventListener("input", e => {
  if (e.target.dataset.act === "proj-next") autosize(e.target);
  if (e.target.dataset.act === "d-due") state.draft.due = e.target.value;
});

// Save edits when a field loses focus or changes
document.addEventListener("change", e => {
  const el = e.target, act = el.dataset.act, p = currentProject();
  const fields = { "proj-name": "name", "proj-status": "status", "proj-color": "color", "proj-next": "next_step", "proj-notes": "notes" };
  if (fields[act] && p) {
    const val = act === "proj-name" ? el.value.trim() : el.value;
    if (act === "proj-name" && !val) { el.value = p.name; return; }
    run(() => api(`/api/projects/${p.id}`, { method: "PATCH", body: { [fields[act]]: val } }), act === "proj-notes" || act === "proj-next" ? "Saved" : null);
  } else if (act === "move") {
    const id = Number(el.closest(".task").dataset.id);
    const pid = el.value ? Number(el.value) : null;
    const name = pid ? project(pid).name : "Inbox";
    run(() => api(`/api/tasks/${id}`, { method: "PATCH", body: { project_id: pid } }), `Moved to ${name}`);
  } else if (act === "bulk-move") {
    if (!el.value) return;
    const ids = [...state.selected], pid = Number(el.value), name = project(pid).name;
    run(async () => { await api("/api/tasks/move", { method: "POST", body: { ids, project_id: pid } }); state.selected.clear(); state.selecting = false; },
      `Moved ${plural(ids.length, "item")} to ${name}`);
  } else if (act === "rename") {
    const id = Number(el.closest(".task").dataset.id);
    const val = el.value.trim();
    const t = state.tasks.find(x => x.id === id);
    if (!val) { el.value = t.title; return; }
    if (val !== t.title) run(() => api(`/api/tasks/${id}`, { method: "PATCH", body: { title: val } }));
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.coach.taskId && !document.querySelector("dialog[open]")) closeCoach();
  if (e.key === "Enter" && (e.target.dataset.act === "rename" || e.target.dataset.act === "proj-name")) e.target.blur();
  if (e.key === "Enter" && !e.shiftKey && e.target.dataset.act === "proj-next") { e.preventDefault(); e.target.blur(); }
  if (e.key === "n" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); document.getElementById("new-task")?.focus(); }
});

// Refresh when you come back to the tab (keeps phone and desktop in sync)
document.addEventListener("visibilitychange", () => { if (!document.hidden && !state.coach.busy) load(); });

load();
</script>
</body>
</html>
